<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jogo 3D | Fase 1</title>
    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
        background: #000; 
        font-family: system-ui, sans-serif; 
      }
      #hud { 
        position: fixed; 
        top: 16px; 
        right: 16px; 
        display: flex; 
        gap: 12px; 
        z-index: 5; }
      #hud span { 
        padding: 8px 14px;
        border-radius: 8px; 
        background: rgba(0, 0, 0, .7); 
        color: #fff; font-size: 18px; 
      }
      #controles { 
        position: fixed; left: 16px; 
        bottom: 16px; 
        margin: 0; 
        padding: 8px 14px; 
        border-radius: 8px; 
        background: rgba(0, 0, 0, .6); 
        color: #ccc; font-size: 14px; 
        z-index: 5; }
      #carregando { 
        position: fixed; 
        inset: 0; 
        display: grid; 
        place-items: center;
        background: #000; 
        color: #00ff08; 
        font-size: 28px; 
        z-index: 20; 
      }
   #mensagem-vitoria { display: none; 
    position: fixed; 
    top: 50%; 
    left: 50%; 
    transform: translate(-50%, -50%); 
    padding: 28px 36px; 
    text-align: center; 
    background: #111; 
    color: #fff; 
    border: 2px solid #00ff08; 
    border-radius: 16px; 
    z-index: 10; 
  }
      #mensagem-vitoria button { 
        margin: 8px 6px 0; 
        padding: 10px 22px; 
        border: 0; 
        border-radius: 30px;
        background: #00ff08; 
        color: #000; 
        font-weight: 600; 
        cursor: pointer; 
      }
      #mensagem-vitoria button.sec { 
        background: none; 
        border: 1px solid #00ff08; 
        color: #00ff08; 
      }
    </style>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@v0.155.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@v0.155.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud"><span id="placar">Esferas: 0</span><span id="tempo">0.0 s</span></div>
    <p id="controles">Clique na tela e use o mouse para girar a câmera em volta do robô · ↑ ↓ ou W S: mover · ← → ou A D: girar · Espaço: subir · Esc: soltar o mouse</p>
    <div id="carregando">Carregando…</div>
    <div id="mensagem-vitoria">
      <h1>Parabéns!</h1>
      <p>Você coletou todas as esferas em <strong id="tempo-final"></strong>.</p>
      <button id="botao-proxima-fase">Próxima fase</button>
      <button id="botao-reiniciar" class="sec">Jogar de novo</button>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
